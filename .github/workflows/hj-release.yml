name: hj-release

on:
  push:
    tags:
      - 'hj/v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing git tag to release (e.g. hj/v0.28.1-hj-1)'
        required: false
        type: string

concurrency:
  group: hj-release-${{ inputs.tag || github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  release:
    name: Build & Release (Windows x64)
    if: startsWith(github.ref, 'refs/tags/hj/v') || github.event_name == 'workflow_dispatch'
    runs-on: windows-latest
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag != '' && (startsWith(inputs.tag, 'refs/tags/') && inputs.tag || format('refs/tags/{0}', inputs.tag)) || github.ref }}
          fetch-depth: 0

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Restore cargo cache
        uses: Swatinem/rust-cache@v2

      - name: Install cargo-wix
        run: cargo install cargo-wix --version 0.3.3 --locked

      - name: Ensure WiX Toolset v3 (candle/light)
        shell: pwsh
        run: |
          if (Get-Command candle -ErrorAction SilentlyContinue) { Write-Host "WiX v3 found: $((Get-Command candle).Source)"; exit 0 }
          $dir = Join-Path $env:RUNNER_TEMP 'wix314'
          Invoke-WebRequest -Uri 'https://github.com/wixtoolset/wix3/releases/download/wix3141rtm/wix314-binaries.zip' -OutFile "$dir.zip"
          Expand-Archive "$dir.zip" -DestinationPath $dir
          $dir | Out-File -FilePath $env:GITHUB_PATH -Append -Encoding utf8
          Write-Host "WiX v3 installed to $dir"

      - name: Derive version from tag
        id: version
        shell: pwsh
        run: |
          $tag = "${{ inputs.tag }}".Trim()
          if (-not $tag) {
            $ref = "${{ github.ref }}"
            if ($ref -match '^refs/tags/(.+)$') {
              $tag = $Matches[1]
            } else {
              $tag = $ref
            }
          }
          if ($tag.StartsWith("refs/tags/")) {
            $tag = $tag.Substring("refs/tags/".Length)
          }

          Write-Host "Resolving version from tag: $tag"

          if ($tag -notmatch '^hj/v(?<base>[0-9]+(?:\.[0-9]+)+)-hj-(?<num>[0-9]+)$') {
            Write-Error "Invalid tag '$tag'. Tag must match format 'hj/v<base>-hj-<N>' (e.g. 'hj/v0.28.1-hj-1')."
            exit 1
          }

          $base = $Matches['base']
          $num = $Matches['num']
          $stringVersion = "$base-hj-$num"
          $numericVersion = "$base.$num"
          # MSI version: fold the hj number into the patch field (0.28.1 + hj-3 -> 0.28.103); see eng/hj/Release.ps1.
          if ([int]$num -ge 100) { Write-Error "hj number must be below 100"; exit 1 }
          $p = $base.Split('.')
          $msiVersion = "$($p[0]).$($p[1]).$([int]$p[2] * 100 + [int]$num)"
          Write-Host "MSI Version:     $msiVersion"
          "msi-version=$msiVersion" >> $env:GITHUB_OUTPUT

          Write-Host "Base:            $base"
          Write-Host "Number:          $num"
          Write-Host "Numeric Version: $numericVersion"
          Write-Host "String Version:  $stringVersion"

          "tag=$tag" >> $env:GITHUB_OUTPUT
          "version=$stringVersion" >> $env:GITHUB_OUTPUT
          "base-version=$base" >> $env:GITHUB_OUTPUT
          "numeric-version=$numericVersion" >> $env:GITHUB_OUTPUT

      - name: Stamp fork version
        shell: pwsh
        run: |
          & pwsh -NoProfile -File eng/hj/Set-HjVersion.ps1 -Version "${{ steps.version.outputs.version }}"

      - name: Build gitui release
        shell: pwsh
        env:
          GITUI_RELEASE: "1"
        run: |
          cargo build --release --locked

      - name: Verify gitui version
        shell: pwsh
        run: |
          $ver = (& .\target\release\gitui.exe --version 2>&1).Trim()
          Write-Host "gitui.exe --version: $ver"
          $expected = "${{ steps.version.outputs.version }}"
          if ($ver -notmatch [regex]::Escape($expected)) {
            Write-Error "Expected version string to contain '$expected', got '$ver'"
            exit 1
          }
          Write-Host "Version verification successful." -ForegroundColor Green

      - name: Package zip and msi
        shell: pwsh
        run: |
          $ver = "${{ steps.version.outputs.version }}"
          $msiVer = "${{ steps.version.outputs.msi-version }}"
          $outputDir = "target/hj"
          New-Item -ItemType Directory -Path $outputDir -Force | Out-Null

          $zipFile = "$outputDir/gitui-hj-win-x64-$ver.zip"
          Write-Host "Creating portable archive $zipFile..."
          $stagingDir = Join-Path ([System.IO.Path]::GetTempPath()) ("gitui-pkg-" + [Guid]::NewGuid().ToString("N"))
          try {
            New-Item -ItemType Directory -Path $stagingDir -Force | Out-Null
            Copy-Item target/release/gitui.exe -Destination (Join-Path $stagingDir "gitui.exe")
            if (Test-Path LICENSE.md) {
              Copy-Item LICENSE.md -Destination (Join-Path $stagingDir "LICENSE.md")
            }
            [System.IO.Compression.ZipFile]::CreateFromDirectory($stagingDir, $zipFile)
          } finally {
            Remove-Item -Path $stagingDir -Recurse -Force -ErrorAction SilentlyContinue
          }

          $msiFile = "$outputDir/gitui-hj-win-x64-$ver.msi"
          Write-Host "Creating WiX MSI installer $msiFile..."
          cargo wix -p gitui --no-build --nocapture --install-version $msiVer --output $msiFile
          if ($LASTEXITCODE -ne 0) { Write-Error "cargo wix failed"; exit 1 }

      - name: Restore Cargo.toml and Cargo.lock
        if: always()
        shell: pwsh
        run: |
          & pwsh -NoProfile -File eng/hj/Set-HjVersion.ps1 -Revert

      - name: Compute SHA-256 Checksums
        shell: pwsh
        run: |
          $files = Get-ChildItem -Path target/hj -Include *.zip,*.msi -Recurse
          Write-Host "=== Generated Release Checksums ==="
          foreach ($f in $files) {
            $hash = (Get-FileHash -Path $f.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
            Write-Host "$hash  $($f.Name)"
            "$hash  $($f.Name)" | Out-File -FilePath "$($f.FullName).sha256" -Encoding ascii
          }

      - name: Publish GitHub Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $tag = "${{ steps.version.outputs.tag }}"
          $ver = "${{ steps.version.outputs.version }}"
          $title = "gitui $ver"

          # Check if release exists
          $releaseExists = $false
          gh release view $tag > $null 2>&1
          if ($LASTEXITCODE -eq 0) {
            $releaseExists = $true
            Write-Host "Release '$tag' already exists."
          } else {
            Write-Host "Creating release '$tag'..."
            gh release create $tag --title $title --notes "gitui $ver release."
            if ($LASTEXITCODE -ne 0) {
              Write-Error "Failed to create release '$tag'"
              exit 1
            }
          }

          Write-Host "Uploading assets to release '$tag'..."
          $assets = Get-ChildItem -Path target/hj -File | Select-Object -ExpandProperty FullName
          gh release upload $tag @assets --clobber
          if ($LASTEXITCODE -ne 0) {
            Write-Error "Failed to upload release assets"
            exit 1
          }
          Write-Host "GitHub release '$tag' published successfully." -ForegroundColor Green
